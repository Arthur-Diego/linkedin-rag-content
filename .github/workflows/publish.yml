name: publish-linkedin

on:
  schedule:
    - cron: "30 11 * * 1,3,5"   # Mon/Wed/Fri 08:30 BRT
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  LINKEDIN_VERSION: "202606"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get install -y -q fonts-dejavu-core || true
          pip install -q -r requirements.txt

      - name: Run pipeline
        id: pipeline
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: PYTHONPATH=src python -m linkedin_pipeline.run

      - name: Commit result (published post / draft artifacts)
        if: steps.pipeline.outputs.mode == 'published' || steps.pipeline.outputs.mode == 'draft'
        run: |
          git config user.name "linkedin-pipeline[bot]"
          git config user.email "actions@github.com"
          git add content out
          if ! git diff --cached --quiet; then
            git commit -m "publish(${{ steps.pipeline.outputs.mode }}): ${{ steps.pipeline.outputs.post_id }} ${{ steps.pipeline.outputs.post_title }}"
            git push
          fi

      - name: Open draft issue (no token configured)
        if: steps.pipeline.outputs.mode == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Draft ready: ${{ steps.pipeline.outputs.post_id }} — ${{ steps.pipeline.outputs.post_title }}"
          if [ -z "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            {
              echo "Caption ready to paste on LinkedIn:"
              echo
              echo '```'
              cat "${{ steps.pipeline.outputs.caption_path }}"
              echo '```'
              echo
              echo "Image: \`${{ steps.pipeline.outputs.image_path }}\` (in the repository)."
              echo
              echo "To publish automatically, configure the \`LINKEDIN_ACCESS_TOKEN\` secret (see docs/operations/runbook.md)."
            } > /tmp/issue-body.md
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
          fi

      - name: Warn about low/empty queue
        if: steps.pipeline.outputs.queue_empty == 'true' || steps.pipeline.outputs.queue_remaining <= 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Content queue running low"
          if [ -z "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE" \
              --body "Only ${{ steps.pipeline.outputs.queue_remaining }} post(s) left in content/queue/. Replenish using the prompt in scripts/PROMPT_GERACAO.md."
          fi
