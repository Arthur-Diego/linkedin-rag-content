name: publish-linkedin

on:
  schedule:
    # Mon/Wed/Fri 00:00 UTC = 21:00 BRT the evening before. GitHub fires this workflow's
    # cron 4-10 h late (measured Sep-Nov 2026), so the approval request is waiting when
    # the morning starts; the publish job only posts inside the morning window below.
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:
    inputs:
      any_time:
        description: "Publish even outside the morning window"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  LINKEDIN_VERSION: "202606"
  # gif  = publish the animated GIF rendered locally and committed to out/ (ADR-010)
  # card = static card rendered here (gpt-image-2 -> Mermaid -> Pillow); switched off for now
  MEDIA_MODE: gif
  # Posts only go out in the morning, São Paulo time: [start, end) in hours.
  PUBLISH_TZ: America/Sao_Paulo
  PUBLISH_FROM_HOUR: "6"
  PUBLISH_UNTIL_HOUR: "12"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pipeline.outputs.mode }}
      post_id: ${{ steps.pipeline.outputs.post_id }}
      post_title: ${{ steps.pipeline.outputs.post_title }}
      image_path: ${{ steps.pipeline.outputs.image_path }}
      caption_path: ${{ steps.pipeline.outputs.caption_path }}
      queue_empty: ${{ steps.pipeline.outputs.queue_empty }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Cache Playwright browsers
        if: env.MEDIA_MODE == 'card'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        if: env.MEDIA_MODE == 'card'
        run: python -m playwright install --with-deps chromium

      - name: Prepare next post (committed GIF, or rendered card in card mode)
        id: pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_QUALITY: high
        run: PYTHONPATH=src python -m linkedin_pipeline.run --render-only

      - name: Commit rendered artifacts
        if: steps.pipeline.outputs.mode == 'rendered'
        run: |
          git config user.name "linkedin-pipeline[bot]"
          git config user.email "actions@github.com"
          git add out
          if ! git diff --cached --quiet; then
            git commit -m "render: ${{ steps.pipeline.outputs.post_id }} ${{ steps.pipeline.outputs.post_title }}"
            git push
          fi

      - name: Preview for approval (job summary)
        if: steps.pipeline.outputs.mode == 'rendered'
        run: |
          {
            echo "## Post ${{ steps.pipeline.outputs.post_id }} — ${{ steps.pipeline.outputs.post_title }}"
            echo
            echo "![media](https://raw.githubusercontent.com/${{ github.repository }}/main/${{ steps.pipeline.outputs.image_path }})"
            echo
            echo "### Caption"
            echo
            echo '```'
            cat "${{ steps.pipeline.outputs.caption_path }}"
            echo '```'
            echo
            echo "Approve the **publish** job to post this to LinkedIn. Posts only go out between ${PUBLISH_FROM_HOUR}:00 and ${PUBLISH_UNTIL_HOUR}:00 (${PUBLISH_TZ}); approve inside that window."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn about empty queue
        if: steps.pipeline.outputs.queue_empty == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Content queue running low"
          if [ -z "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE" \
              --body "The queue in content/queue/ is empty. Replenish using the prompt in scripts/PROMPT_GERACAO.md."
          fi

  publish:
    needs: prepare
    if: needs.prepare.outputs.mode == 'rendered'
    environment: linkedin
    runs-on: ubuntu-latest
    steps:
      - name: Morning window check
        if: ${{ !inputs.any_time }}
        run: |
          hour=$((10#$(TZ="$PUBLISH_TZ" date +%H)))
          now=$(TZ="$PUBLISH_TZ" date "+%H:%M %Z")
          if [ "$hour" -lt "$PUBLISH_FROM_HOUR" ] || [ "$hour" -ge "$PUBLISH_UNTIL_HOUR" ]; then
            echo "::error::Approved at $now, outside the ${PUBLISH_FROM_HOUR}:00-${PUBLISH_UNTIL_HOUR}:00 morning window. Nothing was published and the post stays queued. Re-run this job tomorrow morning (Re-run failed jobs), or dispatch the workflow with any_time checked."
            exit 1
          fi
          echo "Inside the morning window ($now)."

      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the artifacts committed by the prepare job

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Publish approved post
        id: pipeline
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: PYTHONPATH=src python -m linkedin_pipeline.run --publish-only

      - name: Commit result (published post / draft artifacts)
        if: steps.pipeline.outputs.mode == 'published' || steps.pipeline.outputs.mode == 'draft'
        run: |
          git config user.name "linkedin-pipeline[bot]"
          git config user.email "actions@github.com"
          git pull --ff-only
          git add content out
          if ! git diff --cached --quiet; then
            git commit -m "publish(${{ steps.pipeline.outputs.mode }}): ${{ steps.pipeline.outputs.post_id }} ${{ steps.pipeline.outputs.post_title }}"
            git push
          fi

      - name: Open draft issue (no token configured)
        if: steps.pipeline.outputs.mode == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Draft ready: ${{ steps.pipeline.outputs.post_id }} — ${{ steps.pipeline.outputs.post_title }}"
          if [ -z "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            {
              echo "Caption ready to paste on LinkedIn:"
              echo
              echo '```'
              cat "${{ steps.pipeline.outputs.caption_path }}"
              echo '```'
              echo
              echo "Image: \`${{ steps.pipeline.outputs.image_path }}\` (in the repository)."
              echo
              echo "To publish automatically, configure the \`LINKEDIN_ACCESS_TOKEN\` secret (see docs/operations/runbook.md)."
            } > /tmp/issue-body.md
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
          fi

      - name: Warn about low queue
        if: steps.pipeline.outputs.queue_remaining <= 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Content queue running low"
          if [ -z "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE" \
              --body "Only ${{ steps.pipeline.outputs.queue_remaining }} post(s) left in content/queue/. Replenish using the prompt in scripts/PROMPT_GERACAO.md."
          fi
