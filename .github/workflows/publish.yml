name: publish-linkedin

on:
  schedule:
    - cron: "30 11 * * 1,3,5"   # Mon/Wed/Fri 08:30 BRT
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  LINKEDIN_VERSION: "202606"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pipeline.outputs.mode }}
      post_id: ${{ steps.pipeline.outputs.post_id }}
      post_title: ${{ steps.pipeline.outputs.post_title }}
      image_path: ${{ steps.pipeline.outputs.image_path }}
      caption_path: ${{ steps.pipeline.outputs.caption_path }}
      queue_empty: ${{ steps.pipeline.outputs.queue_empty }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Render next post (diagram card + caption)
        id: pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_QUALITY: high
        run: PYTHONPATH=src python -m linkedin_pipeline.run --render-only

      - name: Commit rendered artifacts
        if: steps.pipeline.outputs.mode == 'rendered'
        run: |
          git config user.name "linkedin-pipeline[bot]"
          git config user.email "actions@github.com"
          git add out
          if ! git diff --cached --quiet; then
            git commit -m "render: ${{ steps.pipeline.outputs.post_id }} ${{ steps.pipeline.outputs.post_title }}"
            git push
          fi

      - name: Preview for approval (job summary)
        if: steps.pipeline.outputs.mode == 'rendered'
        run: |
          {
            echo "## Post ${{ steps.pipeline.outputs.post_id }} — ${{ steps.pipeline.outputs.post_title }}"
            echo
            echo "![card](https://raw.githubusercontent.com/${{ github.repository }}/main/${{ steps.pipeline.outputs.image_path }})"
            echo
            echo "### Caption"
            echo
            echo '```'
            cat "${{ steps.pipeline.outputs.caption_path }}"
            echo '```'
            echo
            echo "Approve the **publish** job to post this to LinkedIn."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn about empty queue
        if: steps.pipeline.outputs.queue_empty == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Content queue running low"
          if [ -z "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE" \
              --body "The queue in content/queue/ is empty. Replenish using the prompt in scripts/PROMPT_GERACAO.md."
          fi

  publish:
    needs: prepare
    if: needs.prepare.outputs.mode == 'rendered'
    environment: linkedin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the artifacts committed by the prepare job

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Publish approved post
        id: pipeline
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: PYTHONPATH=src python -m linkedin_pipeline.run --publish-only

      - name: Commit result (published post / draft artifacts)
        if: steps.pipeline.outputs.mode == 'published' || steps.pipeline.outputs.mode == 'draft'
        run: |
          git config user.name "linkedin-pipeline[bot]"
          git config user.email "actions@github.com"
          git pull --ff-only
          git add content out
          if ! git diff --cached --quiet; then
            git commit -m "publish(${{ steps.pipeline.outputs.mode }}): ${{ steps.pipeline.outputs.post_id }} ${{ steps.pipeline.outputs.post_title }}"
            git push
          fi

      - name: Open draft issue (no token configured)
        if: steps.pipeline.outputs.mode == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Draft ready: ${{ steps.pipeline.outputs.post_id }} — ${{ steps.pipeline.outputs.post_title }}"
          if [ -z "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            {
              echo "Caption ready to paste on LinkedIn:"
              echo
              echo '```'
              cat "${{ steps.pipeline.outputs.caption_path }}"
              echo '```'
              echo
              echo "Image: \`${{ steps.pipeline.outputs.image_path }}\` (in the repository)."
              echo
              echo "To publish automatically, configure the \`LINKEDIN_ACCESS_TOKEN\` secret (see docs/operations/runbook.md)."
            } > /tmp/issue-body.md
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
          fi

      - name: Warn about low queue
        if: steps.pipeline.outputs.queue_remaining <= 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Content queue running low"
          if [ -z "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE" \
              --body "Only ${{ steps.pipeline.outputs.queue_remaining }} post(s) left in content/queue/. Replenish using the prompt in scripts/PROMPT_GERACAO.md."
          fi
